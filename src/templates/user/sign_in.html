{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block style %}
<script src="https://accounts.google.com/gsi/client" async></script>
<link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='styles/home.css') }}">
{% endblock %}

{% block content %}
<section class="signin">
  <!-- g_id_onload contains Google Identity Services settings -->
    <div
      id="g_id_onload"
      data-ux_mode="popup"
      data-context="signin"
      data-auto_prompt="false"
      data-login_uri="http://localhost:5000/signin/"
      data-client_id="889438295623-l0f1b0s9ima8g09e5q5r7fcggd8c9512.apps.googleusercontent.com"
    ></div>
    <!-- g_id_signin places the button on a page and supports customization -->
    <div class="g_id_signin"></div>
</section>
{% endblock %}
