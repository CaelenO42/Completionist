<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Boring Stuff -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO / Embed Stuff -->
    <meta name="description" content="An all in one platform for making the PC Game shopping experience easy." />
    <meta name="theme-color" content="rgb(18, 18, 18)" />
    <meta name="og:title" content="{% block title %}{% endblock %} | Completionist" />
    <meta name="og:type" content="website" />
    <!-- Title -->
    <title>{{ self.title() }} | Completionist</title>
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='img/logo_icon.svg') }}" />
    <!-- Script / Style References -->
    <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/56b07f00c9.js" crossorigin="anonymous"></script>
    {% block style %}
    {% endblock %}
  </head>
  <body>
    {% block nav %}
    <nav>
      <p>This is the nav</p>
    </nav>
    {% endblock %}
    {% block content %}
    {% endblock %}
    {% block footer %}
    <footer>
      <p>This is the footer</p>
    </footer>
    {% endblock %}
  </body>
</html>
